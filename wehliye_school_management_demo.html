<!doctype html>
<html lang="so">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wehliye Design | School Management</title>
<style>
:root{--blue:#2457c5;--navy:#153778;--bg:#f3f6fc;--ink:#17243b;--muted:#71809a;--line:#e5eaf3;--green:#16a34a;--red:#e5484d;--orange:#f59e0b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,#17469f,#102f70);color:white;padding:24px 16px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;gap:11px;align-items:center;padding:4px 8px}.logo{width:43px;height:43px;background:#fff;color:var(--blue);border-radius:13px;display:grid;place-items:center;font-size:24px}.brand strong{display:block;font-size:16px}.brand small{opacity:.75;font-size:11px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#dbe7ff;text-align:left;padding:12px 13px;border-radius:11px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#ffffff24;color:#fff}.nav .ico{width:22px;text-align:center;font-size:17px}.side-foot{margin-top:auto;font-size:12px;line-height:1.6;color:#dbe7ff;padding:12px}
main{min-width:0}.topbar{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:15px}.topbar h2{margin:0;font-size:20px}.top-right{display:flex;align-items:center;gap:13px}.avatar{width:36px;height:36px;border-radius:50%;background:#dbeafe;color:var(--navy);display:grid;place-items:center;font-weight:800}.content{padding:28px;max-width:1450px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.welcome h1{margin:0 0 6px;font-size:25px}.welcome p{margin:0;color:var(--muted);font-size:14px}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--blue);color:white;font-weight:650}.btn:hover{filter:brightness(.95)}.btn.secondary{background:#eaf0ff;color:var(--blue)}.btn.danger{background:#fff0f0;color:#c83232}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:0 4px 18px #193b7410}.stat-head{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.stat-icon{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:#eaf0ff;color:var(--blue)}.stat strong{display:block;font-size:28px;margin:14px 0 4px}.stat small{color:var(--muted)}.columns{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.panel{margin-bottom:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:17px}.panel h3{margin:0;font-size:16px}.muted{color:var(--muted);font-size:13px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{border:1px solid var(--line);background:#fbfcff;border-radius:12px;padding:15px 8px;color:var(--navy);display:grid;gap:8px;justify-items:center}.quick button span{font-size:22px}.quick button:hover{border-color:#a9c0f5;background:#f3f7ff}.activity{display:grid;gap:0}.activity-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #eef1f7}.activity-row:last-child{border-bottom:0}.mini-avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#edf2ff;color:var(--blue);font-weight:700}.activity-row strong{font-size:13px}.activity-row small{display:block;color:var(--muted);margin-top:3px}.pill{font-size:11px;font-weight:700;border-radius:20px;padding:5px 9px;background:#e8f8ed;color:#16803d;margin-left:auto}.pill.absent{background:#ffeded;color:#bf3030}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select,.field input,.field select{border:1px solid #dce3ef;border-radius:10px;padding:11px 12px;background:white;color:var(--ink);min-width:0}.toolbar input{flex:1;min-width:170px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:550px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #edf0f6;font-size:13px}th{color:var(--muted);font-weight:650;background:#fbfcff}td strong{font-size:13px}.empty{text-align:center;padding:32px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field label{font-size:13px;font-weight:650}.field input,.field select{width:100%}.field.full{grid-column:1/-1}.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.notice{background:#edf5ff;border:1px solid #d7e7ff;border-radius:12px;padding:12px 14px;color:#25477e;font-size:13px;margin-bottom:16px}.mobile-nav{display:none}.hidden{display:none!important}
@media(max-width:950px){.app{grid-template-columns:1fr}.sidebar{display:none}.topbar{padding:0 18px;height:66px}.content{padding:20px 16px 90px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}.mobile-nav{position:fixed;display:flex;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}.mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:10px;display:grid;gap:4px;justify-items:center}.mobile-nav button span{font-size:18px}.mobile-nav button.active{color:var(--blue)}.welcome h1{font-size:21px}.top-right .admin-label{display:none}}
@media(max-width:480px){.stats{gap:10px}.stat{padding:14px}.stat strong{font-size:24px}.stat-head{font-size:12px}.stat-icon{width:33px;height:33px}.welcome{align-items:flex-start}.welcome .btn{padding:10px;font-size:12px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.quick{grid-template-columns:repeat(3,1fr)}.quick button{font-size:11px}.panel{padding:15px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">🎓</div><div><strong>Wehliye Design</strong><small>School Management</small></div></div>
  <nav class="nav" id="sideNav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span> Dashboard</button>
    <button data-page="students"><span class="ico">♙</span> Ardayda</button>
    <button data-page="teachers"><span class="ico">♟</span> Macallimiinta</button>
    <button data-page="attendance"><span class="ico">☑</span> Xaadirinta</button>
    <button data-page="classes"><span class="ico">▤</span> Fasallada</button>
    <button data-page="fees"><span class="ico">＄</span> Lacagaha</button>
    <button data-page="reports"><span class="ico">▥</span> Warbixinnada</button>
    <button data-page="settings"><span class="ico">⚙</span> Dejinta</button>
  </nav>
  <div class="side-foot">Maamul dugsi si fudud.<br>© 2026 Wehliye Design</div>
</aside>
<main>
<header class="topbar"><h2 id="pageTitle">Dashboard</h2><div class="top-right"><span class="admin-label">Maamulka Dugsiga</span><div class="avatar">WA</div></div></header>
<div class="content" id="content"></div>
</main>
</div>
<nav class="mobile-nav" id="mobileNav">
<button class="active" data-page="dashboard"><span>▦</span>Home</button><button data-page="students"><span>♙</span>Ardayda</button><button data-page="attendance"><span>☑</span>Xaadirin</button><button data-page="fees"><span>＄</span>Lacagaha</button><button data-page="settings"><span>⚙</span>More</button>
</nav>
<div id="modal" class="hidden"></div>
<script>
const initialStudents=[
{id:1,name:"Ahmed Mohamed",grade:"Fasalka 10A",phone:"252 612 345678",status:"Active"},
{id:2,name:"Amina Hassan",grade:"Fasalka 9B",phone:"252 612 456789",status:"Active"},
{id:3,name:"Mohamed Yusuf",grade:"Fasalka 11A",phone:"252 612 567890",status:"Active"},
{id:4,name:"Fatima Ali",grade:"Fasalka 8A",phone:"252 612 678901",status:"Active"},
{id:5,name:"Ibrahim Abdi",grade:"Fasalka 10B",phone:"252 612 789012",status:"Active"}
];
let students=JSON.parse(localStorage.getItem("wd_students")||"null")||initialStudents;
let teachers=JSON.parse(localStorage.getItem("wd_teachers")||"null")||[{id:1,name:"Maryan Ahmed",subject:"English",phone:"252 612 111222"},{id:2,name:"Abdi Nur",subject:"Mathematics",phone:"252 612 222333"}];
let attendance=JSON.parse(localStorage.getItem("wd_attendance")||"{}");
let payments=JSON.parse(localStorage.getItem("wd_payments")||"null")||[{id:1,name:"Ahmed Mohamed",amount:50,date:"2026-10-01",status:"Paid"},{id:2,name:"Amina Hassan",amount:50,date:"2026-10-03",status:"Paid"},{id:3,name:"Mohamed Yusuf",amount:50,date:"2026-10-04",status:"Pending"}];
let page="dashboard";
const save=()=>{localStorage.setItem("wd_students",JSON.stringify(students));localStorage.setItem("wd_teachers",JSON.stringify(teachers));localStorage.setItem("wd_attendance",JSON.stringify(attendance));localStorage.setItem("wd_payments",JSON.stringify(payments))};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n||0).toLocaleString();
function setPage(p){page=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));const titles={dashboard:"Dashboard",students:"Ardayda",teachers:"Macallimiinta",attendance:"Xaadirinta",classes:"Fasallada",fees:"Lacagaha Dugsiga",reports:"Warbixinnada",settings:"Dejinta"};document.getElementById("pageTitle").textContent=titles[p]||"Wehliye Design";render()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(b)setPage(b.dataset.page)});
function render(){const c=document.getElementById("content");if(page==="dashboard")c.innerHTML=dashboard();else if(page==="students")c.innerHTML=peoplePage("students");else if(page==="teachers")c.innerHTML=peoplePage("teachers");else if(page==="attendance")c.innerHTML=attendancePage();else if(page==="classes")c.innerHTML=classesPage();else if(page==="fees")c.innerHTML=feesPage();else if(page==="reports")c.innerHTML=reportsPage();else c.innerHTML=settingsPage();wirePage()}
function dashboard(){let today=new Date().toISOString().slice(0,10),a=attendance[today]||{};let present=Object.values(a).filter(x=>x==="Joogaa").length;let paid=payments.filter(p=>p.status==="Paid").reduce((s,p)=>s+Number(p.amount),0);return `
<div class="welcome"><div><h1>Ku soo dhowow, Maamule! 👋</h1><p>Halkan ka maamul hawlaha dugsigaaga.</p></div><button class="btn" data-action="add-student">＋ Arday cusub</button></div>
<div class="stats">
<div class="stat"><div class="stat-head">Wadarta ardayda <span class="stat-icon">♙</span></div><strong>${students.length}</strong><small>Arday diiwaangashan</small></div>
<div class="stat"><div class="stat-head">Macallimiinta <span class="stat-icon" style="background:#e6f8ed;color:#16803d">♟</span></div><strong>${teachers.length}</strong><small>Macallimiin diiwaangashan</small></div>
<div class="stat"><div class="stat-head">Joogitaanka maanta <span class="stat-icon" style="background:#fff2db;color:#a36500">☑</span></div><strong>${present}</strong><small>Arday xaadir ah</small></div>
<div class="stat"><div class="stat-head">Lacag la bixiyey <span class="stat-icon" style="background:#f1e9ff;color:#7542c8">＄</span></div><strong>${money(paid)}</strong><small>Wadarta lacagaha la helay</small></div>
</div>
<div class="columns"><section class="panel"><div class="panel-head"><h3>Hawlaha degdegga ah</h3><span class="muted">Quick actions</span></div><div class="quick">
<button data-page="students"><span>👨‍🎓</span>Ardayda</button><button data-page="teachers"><span>👩‍🏫</span>Macallimiinta</button><button data-page="attendance"><span>☑️</span>Xaadirinta</button><button data-page="classes"><span>📚</span>Fasallada</button><button data-page="fees"><span>💳</span>Lacagaha</button><button data-page="reports"><span>📊</span>Warbixin</button>
</div></section><section class="panel"><div class="panel-head"><h3>Ardaydii ugu dambeysay</h3><button class="btn secondary" data-page="students">Dhammaan</button></div><div class="activity">${students.slice(-4).reverse().map(s=>`<div class="activity-row"><div class="mini-avatar">${esc(s.name.charAt(0))}</div><div><strong>${esc(s.name)}</strong><small>${esc(s.grade)}</small></div><span class="pill">Firfircoon</span></div>`).join("")||'<div class="empty">Weli arday lama darin.</div>'}</div></section></div>
<section class="panel"><div class="panel-head"><h3>Ogeysiis</h3></div><div class="notice">Tani waa demo shaqaynaya. Xogta waxaad ku tijaabin kartaa browser-kan; xogtu waxay ku kaydsan tahay qalabkaaga.</div></section>`}
function peoplePage(type){let isS=type==="students",arr=isS?students:teachers,title=isS?"Liiska Ardayda":"Liiska Macallimiinta",placeholder=isS?"Raadi magaca ama fasalka...":"Raadi magaca ama maadada...";return `<div class="welcome"><div><h1>${title}</h1><p>${isS?"Ku dar, raadi, ama ka saar ardayda.":"Maamul macallimiinta iyo maadooyinkooda."}</p></div><button class="btn" data-action="${isS?"add-student":"add-teacher"}">＋ ${isS?"Arday ku dar":"Macallin ku dar"}</button></div><section class="panel"><div class="toolbar"><input id="searchPeople" placeholder="${placeholder}"><span class="muted" style="align-self:center">${arr.length} qof</span></div><div class="table-wrap"><table><thead><tr><th>Magaca</th><th>${isS?"Fasalka":"Maadada"}</th><th>Telefoon</th><th>Xaalad</th><th>Ficil</th></tr></thead><tbody id="peopleRows">${peopleRows(arr,isS)}</tbody></table></div></section>`}
function peopleRows(arr,isS){return arr.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${esc(isS?s.grade:s.subject)}</td><td>${esc(s.phone||"—")}</td><td><span class="pill">Firfircoon</span></td><td><button class="btn danger" data-action="delete-person" data-id="${s.id}" data-type="${isS?"students":"teachers"}">Ka saar</button></td></tr>`).join("")||'<tr><td colspan="5" class="empty">Xog lama helin.</td></tr>'}
function attendancePage(){let date=new Date().toISOString().slice(0,10),a=attendance[date]||{};return `<div class="welcome"><div><h1>Xaadirinta Ardayda</h1><p>Dooro xaaladda arday kasta maanta.</p></div><button class="btn" data-action="save-attendance">Kaydi xaadirinta</button></div><section class="panel"><div class="toolbar"><input type="date" id="attendanceDate" value="${date}"><input id="attendanceSearch" placeholder="Raadi arday..."></div><div class="table-wrap"><table><thead><tr><th>Ardayga</th><th>Fasalka</th><th>Xaaladda maanta</th></tr></thead><tbody id="attendanceRows">${attendanceRows(students,a)}</tbody></table></div><p class="muted">Doorashooyinka si toos ah ayey u cusboonaysiiyaan tirada dashboard-ka marka la kaydiyo.</p></section>`}
function attendanceRows(arr,a){return arr.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${esc(s.grade)}</td><td><select class="att-select" data-id="${s.id}"><option ${a[s.id]==="Joogaa"?"selected":""}>Joogaa</option><option ${a[s.id]==="Maqan"?"selected":""}>Maqan</option><option ${a[s.id]==="Daahay"?"selected":""}>Daahay</option></select></td></tr>`).join("")||'<tr><td colspan="3" class="empty">Arday ma jiro.</td></tr>'}
function classesPage(){let grades=["Fasalka 8A","Fasalka 9A","Fasalka 9B","Fasalka 10A","Fasalka 10B","Fasalka 11A","Fasalka 12A"];return `<div class="welcome"><div><h1>Fasallada</h1><p>Tirada ardayda ee fasal kasta.</p></div></div><div class="stats">${grades.map((g,i)=>`<div class="stat"><div class="stat-head">${g}<span class="stat-icon">📚</span></div><strong>${students.filter(s=>s.grade===g).length}</strong><small>Arday</small></div>`).join("")}</div>`}
function feesPage(){let paid=payments.filter(p=>p.status==="Paid").reduce((s,p)=>s+Number(p.amount),0),pending=payments.filter(p=>p.status!=="Paid").reduce((s,p)=>s+Number(p.amount),0);return `<div class="welcome"><div><h1>Lacagaha Dugsiga</h1><p>La soco lacagaha la bixiyey iyo kuwa harsan.</p></div><button class="btn" data-action="add-payment">＋ Diiwaangeli lacag</button></div><div class="stats"><div class="stat"><div class="stat-head">La bixiyey</div><strong>${money(paid)}</strong><small>Wadarta la helay</small></div><div class="stat"><div class="stat-head">Sugaya</div><strong>${money(pending)}</strong><small>Weli lama bixin</small></div></div><section class="panel"><div class="panel-head"><h3>Diiwaanka lacagaha</h3></div><div class="table-wrap"><table><thead><tr><th>Ardayga</th><th>Qadarka</th><th>Taariikhda</th><th>Xaalad</th><th>Ficil</th></tr></thead><tbody>${payments.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${money(p.amount)}</td><td>${esc(p.date)}</td><td><span class="pill ${p.status==="Paid"?"":"absent"}">${p.status==="Paid"?"La bixiyey":"Sugaya"}</span></td><td>${p.status!=="Paid"?`<button class="btn secondary" data-action="mark-paid" data-id="${p.id}">Calaamadee la bixiyey</button>`:"—"}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">Lacag lama diiwaangelin.</td></tr>'}</tbody></table></div></section>`}
function reportsPage(){return `<div class="welcome"><div><h1>Warbixinnada</h1><p>Kooban xogta dugsiga hadda ku jirta demo-ga.</p></div><button class="btn" data-action="export">Soo dejiso CSV</button></div><div class="stats"><div class="stat"><div class="stat-head">Arday</div><strong>${students.length}</strong></div><div class="stat"><div class="stat-head">Macallimiin</div><strong>${teachers.length}</strong></div><div class="stat"><div class="stat-head">Diiwaanka lacagaha</div><strong>${payments.length}</strong></div><div class="stat"><div class="stat-head">Xaadirin la kaydiyey</div><strong>${Object.keys(attendance).length} maalmood</strong></div></div><section class="panel"><h3>Xogta demo-ga</h3><p class="muted">Warbixintan waxay ku salaysan tahay xogta ku kaydsan browser-kaaga.</p></section>`}
function settingsPage(){return `<div class="welcome"><div><h1>Dejinta</h1><p>Macluumaadka app-ka iyo xogta tijaabada.</p></div></div><section class="panel"><h3>Wehliye Design</h3><p class="muted">School Management System · Android-first responsive web app</p><div class="notice">Demo-gani ma laha login ammaan ah ama database server. Xogtu waxay ku kaydsan tahay browser-ka qalabkaaga.</div><button class="btn danger" data-action="reset">Dib u celi xogta demo-ga</button></section>`}
function wirePage(){let search=document.getElementById("searchPeople");if(search)search.addEventListener("input",()=>{let isS=page==="students",arr=isS?students:teachers,q=search.value.toLowerCase();document.getElementById("peopleRows").innerHTML=peopleRows(arr.filter(s=>(s.name+" "+(isS?s.grade:s.subject)+" "+s.phone).toLowerCase().includes(q)),isS)});let as=document.getElementById("attendanceSearch");if(as)as.addEventListener("input",()=>{let q=as.value.toLowerCase(),d=document.getElementById("attendanceDate").value;document.getElementById("attendanceRows").innerHTML=attendanceRows(students.filter(s=>(s.name+" "+s.grade).toLowerCase().includes(q)),attendance[d]||{})})}
function openModal(title,body,submitText,callback){let m=document.getElementById("modal");m.className="";m.innerHTML=`<div style="position:fixed;inset:0;background:#0b183b88;z-index:10;display:grid;place-items:center;padding:16px"><div class="panel" style="width:min(520px,100%);max-height:90vh;overflow:auto;margin:0"><div class="panel-head"><h3>${title}</h3><button class="btn secondary" data-action="close-modal">✕</button></div><form id="modalForm">${body}<div class="form-actions"><button type="button" class="btn secondary" data-action="close-modal">Jooji</button><button class="btn" type="submit">${submitText}</button></div></form></div></div>`;document.getElementById("modalForm").onsubmit=e=>{e.preventDefault();callback(new FormData(e.target));m.className="hidden";m.innerHTML=""}}
document.addEventListener("click",e=>{let b=e.target.closest("[data-action]");if(!b)return;let a=b.dataset.action,id=Number(b.dataset.id);if(a==="add-student")openModal("Diiwaangeli arday",`<div class="form-grid"><div class="field full"><label>Magaca oo buuxa</label><input name="name" required placeholder="Tusaale: Ali Hassan"></div><div class="field"><label>Fasalka</label><select name="grade"><option>Fasalka 8A</option><option>Fasalka 9A</option><option>Fasalka 9B</option><option>Fasalka 10A</option><option>Fasalka 10B</option><option>Fasalka 11A</option><option>Fasalka 12A</option></select></div><div class="field"><label>Telefoon</label><input name="phone" placeholder="252 61..."></div></div>`,"Kaydi ardayga",f=>{students.push({id:Date.now(),name:f.get("name").trim(),grade:f.get("grade"),phone:f.get("phone"),status:"Active"});save();render()});
else if(a==="add-teacher")openModal("Diiwaangeli macallin",`<div class="form-grid"><div class="field full"><label>Magaca oo buuxa</label><input name="name" required></div><div class="field"><label>Maadada</label><input name="subject" required placeholder="Tusaale: English"></div><div class="field"><label>Telefoon</label><input name="phone"></div></div>`,"Kaydi macallinka",f=>{teachers.push({id:Date.now(),name:f.get("name").trim(),subject:f.get("subject"),phone:f.get("phone")});save();render()});
else if(a==="delete-person"){if(confirm("Ma hubtaa inaad qofkan ka saarayso?")){if(b.dataset.type==="students")students=students.filter(s=>s.id!==id);else teachers=teachers.filter(s=>s.id!==id);save();render()}}
else if(a==="save-attendance"){let date=document.getElementById("attendanceDate").value;if(!date){alert("Fadlan dooro taariikh.");return}attendance[date]={};document.querySelectorAll(".att-select").forEach(s=>attendance[date][s.dataset.id]=s.value);save();alert("Xaadirinta waa la kaydiyey!");render()}
else if(a==="add-payment")openModal("Diiwaangeli lacag",`<div class="form-grid"><div class="field full"><label>Ardayga</label><select name="name" required>${students.map(s=>`<option>${esc(s.name)}</option>`).join("")}</select></div><div class="field"><label>Qadarka ($)</label><input name="amount" type="number" min="1" required></div><div class="field"><label>Taariikhda</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field full"><label>Xaaladda</label><select name="status"><option value="Paid">La bixiyey</option><option value="Pending">Sugaya</option></select></div></div>`,"Kaydi lacagta",f=>{payments.push({id:Date.now(),name:f.get("name"),amount:Number(f.get("amount")),date:f.get("date"),status:f.get("status")});save();render()});
else if(a==="mark-paid"){let p=payments.find(p=>p.id===id);if(p){p.status="Paid";save();render()}}
else if(a==="export"){let csv="Name,Grade,Phone\\n"+students.map(s=>[s.name,s.grade,s.phone].map(x=>'"'+String(x||"").replaceAll('"','""')+'"').join(",")).join("\\n");let url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"})),link=document.createElement("a");link.href=url;link.download="wehliye-students.csv";link.click();URL.revokeObjectURL(url)}
else if(a==="reset"){if(confirm("Tani waxay tirtiraysaa xogta demo-ga ee browser-kan. Sii wad?")){["wd_students","wd_teachers","wd_attendance","wd_payments"].forEach(k=>localStorage.removeItem(k));location.reload()}}
else if(a==="close-modal"){document.getElementById("modal").className="hidden";document.getElementById("modal").innerHTML=""}});
render();
</script>
</body></html>
